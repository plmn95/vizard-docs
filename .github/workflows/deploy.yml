name: Deploy documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate documentation
        run: npm run check:docs
      - run: npm run test:archives
      - run: npm run test:suggestions
      - run: npm run build
        env:
          VIZARD_SUGGESTIONS_API: ${{ vars.VIZARD_SUGGESTIONS_API }}
          VIZARD_TURNSTILE_SITE_KEY: ${{ vars.VIZARD_TURNSTILE_SITE_KEY }}
      - name: Assemble frozen release manuals
        run: npm run assemble:archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
